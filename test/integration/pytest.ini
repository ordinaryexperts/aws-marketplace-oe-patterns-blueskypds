[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Quick smoke tests
    slow: Slow end-to-end tests

addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

timeout = 60

testpaths = .

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
