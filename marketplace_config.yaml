# AWS Marketplace submission configuration
# Used by `make marketplace-validate` / `make marketplace-submit` / `make marketplace-status`
# (via scripts/marketplace.py in the devenv image).

product_id: "prod-ufpvcz32f2pdq"

# IAM role that allows AWS Marketplace to read the AMI
ami_access_role_arn: "arn:aws:iam::879777583535:role/AWSMarketplaceAMIScanning"

# Pattern for the CloudFormation parameter that receives the AMI ID.
# {version} is the pattern version with dots stripped (e.g. "2.0.0" -> "200").
ami_parameter_pattern: "AsgAmiIdv{version}"

# S3 bucket and path prefix where CloudFormation templates are published
template_bucket: "ordinary-experts-aws-marketplace-pattern-artifacts"
template_pattern: "blueskypds"

# Whether to include a standalone AMI delivery option in addition to the
# CloudFormation delivery option. This product ships as a CloudFormation
# template only.
include_standalone_ami: false

# AMI / OS metadata
operating_system: "UBUNTU"
operating_system_version: "24.04"
username: "ubuntu"
recommended_instance_type: "t4g.small"

usage_instructions: >-
  Run the stack, providing valid parameters. When the stack creation completes,
  go to the outputs of the stack and open the URL in your browser. To create the
  initial user account, connect to the EC2 instance via Session Manager and run
  `sudo pdsadmin account create`. All Bluesky PDS data (SQLite database, blob
  store) lives on the encrypted EBS data volume that persists across instance
  replacement. For more detailed instructions, see the GitHub project.

# CloudFormation delivery option details
delivery_option:
  short_description: |
    Deploy a production-ready Bluesky PDS (Personal Data Server) on AWS with this CloudFormation template and custom AMI. Provisions VPC, Auto Scaling Group with persistent EBS data volume, ALB, SES, and Route53.
  long_description: |
    Bluesky PDS on AWS by FOSSonCloud deploys a production-ready Bluesky Personal Data Server using AWS best practices.

    WHAT'S DEPLOYED

    - VPC with public and private subnets (or use your existing VPC)
    - Application Load Balancer with ACM certificate for HTTPS
    - Auto Scaling Group running a single Bluesky PDS instance (Graviton / arm64)
    - Persistent encrypted EBS data volume for SQLite database and blob storage
    - SES domain identity with Easy DKIM for email delivery
    - Route53 DNS records (apex + wildcard for handle resolution)
    - CloudWatch Logs integration
    - AWS Secrets Manager for credential storage (PDS JWT secret, admin password, PLC rotation key, SMTP password)
    - IAM roles with least-privilege permissions
    - SNS notification topic for stack events

    REQUIREMENTS

    - Route 53 hosted zone for DNS
    - ACM certificate for HTTPS (must cover the apex hostname and the *.<hostname> wildcard for user handles)
  architecture_diagram_url: "https://ordinary-experts-aws-marketplace-pattern-artifacts.s3.amazonaws.com/blueskypds/2.0.0/diagram.png"
